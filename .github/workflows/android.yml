name: Android Instaladores

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bem-instalado/frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: bem-instalado/frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Preparar Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" >/dev/null
          set -o pipefail

      - name: Instalar dependências
        run: npm ci

      - name: Gerar aplicativo web dos instaladores
        run: npm run build:android:web

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Preparar assinatura permanente
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/instalapro-upload.jks"

      - name: Compilar APK instalável
        working-directory: bem-instalado/frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/instalapro-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar assinatura do APK
        working-directory: bem-instalado/frontend/android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Preparar arquivo para download
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk InstalaPro-Instaladores.apk
          sha256sum InstalaPro-Instaladores.apk > InstalaPro-Instaladores.apk.sha256

      - name: Salvar APK na execução
        uses: actions/upload-artifact@v6
        with:
          name: InstalaPro-Instaladores
          path: |
            bem-instalado/frontend/InstalaPro-Instaladores.apk
            bem-instalado/frontend/InstalaPro-Instaladores.apk.sha256
          if-no-files-found: error

      - name: Publicar versão para download
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            InstalaPro-Instaladores.apk \
            InstalaPro-Instaladores.apk.sha256 \
            --title "InstalaPro Instaladores ${GITHUB_REF_NAME#android-v}" \
            --notes "Aplicativo Android exclusivo para instaladores. APK assinado para permitir atualizações futuras sem reinstalação."

      - name: Remover chave temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/instalapro-upload.jks"
